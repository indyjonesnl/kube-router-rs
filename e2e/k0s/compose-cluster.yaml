# Local e2e k0s cluster: 1 controller + 3 workers (no LB — single controller
# publishes the API directly). Derived from k0s docs/compose-cluster.yaml
# (v1.35.5+k0s.0). The 3 workers give cross-node pod networking to validate
# kube-router-rs.
#
# Bring up:   docker compose -f e2e/k0s/compose-cluster.yaml up -d
# Kubeconfig: e2e/k0s/kubeconfig.sh   (writes ~/.kube/k0s-docker.yaml)
# Tear down:  docker compose -f e2e/k0s/compose-cluster.yaml down -v
name: kube-router-rs-k0s

x-k0s-image: &k0s-image docker.io/k0sproject/k0s:v1.35.5-k0s.0

x-k0s-worker: &k0s-worker
  image: *k0s-image
  networks:
    - k0s-net
  # Wait for the controller to be HEALTHY, not merely started. The controller's
  # healthcheck below goes green only once the pre-shared worker token exists —
  # the file named right here in --token-file.
  # With a plain start-order dependency compose launches all four containers
  # within ~0.2s, long before the controller has generated its PKI and the token,
  # so every worker starts into a doomed kubelet bootstrap, exhausts its attempts,
  # exits, and gets restarted under `restart: on-failure` backoff. A worker only
  # starts containerd after that bootstrap succeeds, so deploy.sh's wait for
  # `k0s ctr version` would then expire mid-backoff — the "TIMEOUT: k0s-worker-1
  # containerd not ready" that has been reding a random subset of the k0s
  # conformance jobs (they die before a kubeconfig exists, taking every other
  # diagnostic in the job with them).
  depends_on:
    k0s-controller-1:
      condition: service_healthy
  command: [k0s, worker, --token-file, /run/secrets/k0sproject.io/tokens/worker]
  volumes:
    - /var/lib/k0s
    - /var/log/pods
    - /dev/kmsg:/dev/kmsg:ro
    - k0s-worker-token:/run/secrets/k0sproject.io/tokens:ro
  tmpfs:
    - /run
    - /tmp
  devices:
    - /dev/kmsg
  # privileged is required so the worker entrypoint can `mount --make-rshared /`
  # for kubelet (CAP_SYS_ADMIN alone is insufficient on modern Docker).
  privileged: true
  security_opt:
    - seccomp:unconfined
  restart: on-failure

networks:
  k0s-net:
    driver: bridge
    # Static subnet so the controller has a fixed IP: konnectivity-agent and
    # kube-router-rs run in the pod/cluster and cannot resolve the docker
    # container name `k0s-controller-1` (docker's embedded DNS is only reachable
    # from the node netns, not pod netns), so the API/konnectivity address must
    # be an IP, not a name.
    ipam:
      config:
        - subnet: 172.31.250.0/24

services:
  k0s-controller-1:
    image: *k0s-image
    container_name: k0s-controller-1
    hostname: k0s-controller-1
    networks:
      k0s-net:
        ipv4_address: 172.31.250.10
    ports:
      - 7443:6443 # publish the API to host :7443 (avoids a :6443 collision on this host)
    tmpfs:
      - /run
      - /tmp
    configs:
      - source: k0s.yaml
        target: /etc/k0s/k0s.yaml
      - source: k0s-token-bootstrap.sh
        target: /etc/k0s-token-bootstrap.sh
    restart: on-failure
    # --enable-worker needs the same privileged worker runtime the workers use
    # (rshared mount for kubelet, writable cgroup for the worker pre-flight,
    # /dev/kmsg, pod logs) — otherwise k0s aborts with a cgroup/pre-flight error.
    privileged: true
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kmsg
    # --enable-worker: run kube-router-rs on the control-plane node too. The
    # apiserver ClusterIP (10.96.0.1) backends to this node, so it must have BGP
    # routes to the worker pod CIDRs to return pod→apiserver traffic; without a
    # kube-router-rs instance here those replies are dropped (coredns/konnectivity
    # never reach the API). The control-plane NoSchedule taint is kept — only the
    # kube-router-rs DaemonSet (tolerations: operator Exists) lands here, not
    # general workloads. Mirrors a real kube-router deployment (runs on all nodes).
    command: [k0s, controller, --enable-worker]
    # Healthy == the worker token exists, which is what the workers block on.
    # start_period covers PKI generation and the bootstrap retries without counting
    # failures, so a slow runner just takes longer rather than tripping the
    # container into `unhealthy`; after it, 30 x 2s before compose gives up with a
    # clear "dependency failed to start" instead of a silent stall.
    healthcheck:
      # The check BOOTSTRAPS as well as verifies. This used to be a `post_start`
      # hook plus a plain `test -f`, but compose runs post_start as a one-shot
      # `docker exec` and does not retry it, so losing the race with container init
      #   OCI runtime exec failed: unable to start container process:
      #   procReady not received
      # left the token permanently unwritten: the controller stayed unhealthy, the
      # workers never started, and `up -d` could not repair it because post_start
      # does not re-run on an existing container. A healthcheck retries every
      # interval by definition, so a lost exec costs 2s instead of the cluster.
      test: ["CMD", "sh", "/etc/k0s-token-bootstrap.sh"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 240s
    volumes:
      - /var/lib/k0s
      - /var/log/pods
      - /dev/kmsg:/dev/kmsg:ro
      - k0s-token-secrets:/var/lib/k0s/manifests/k0s-token-secrets
      - k0s-worker-token:/run/secrets/k0sproject.io/worker-token

  k0s-worker-1:
    <<: *k0s-worker
    container_name: k0s-worker-1
    hostname: k0s-worker-1

  k0s-worker-2:
    <<: *k0s-worker
    container_name: k0s-worker-2
    hostname: k0s-worker-2

  k0s-worker-3:
    <<: *k0s-worker
    container_name: k0s-worker-3
    hostname: k0s-worker-3

volumes:
  k0s-token-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  k0s-worker-token:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

configs:
  # Idempotent: exits 0 as soon as the worker token exists, otherwise tries to
  # create it and reports unhealthy so the next interval retries. Every step is
  # allowed to fail; only the token's existence decides the verdict.
  k0s-token-bootstrap.sh:
    content: |
      #!/bin/sh
      TOKDIR=/run/secrets/k0sproject.io/worker-token
      TOKEN="$$TOKDIR/worker"
      [ -f "$$TOKEN" ] && exit 0
      # The controller has to have generated its PKI before a token can be signed.
      [ -f /var/lib/k0s/pki/ca.crt ] || exit 1
      # Clear partial output from an attempt that failed midway.
      rm -rf "$$TOKDIR"/*.yaml "$$TOKDIR"/token_* 2>/dev/null
      k0s token pre-shared --role worker \
        --cert /var/lib/k0s/pki/ca.crt \
        --url https://172.31.250.10:6443 \
        --out "$$TOKDIR/" || exit 1
      mv "$$TOKDIR"/*.yaml /var/lib/k0s/manifests/k0s-token-secrets/worker.yaml || exit 1
      mv "$$TOKDIR"/token_* "$$TOKEN" || exit 1
      [ -f "$$TOKEN" ]
  k0s.yaml:
    content: |
      spec:
        api:
          externalAddress: 172.31.250.10
          sans:
            - 172.31.250.10
            - k0s-controller-1
            - 127.0.0.1
            - localhost
        storage:
          type: kine # SQLite-backed (kine) instead of etcd — far lower memory; fine for a single controller
        network:
          provider: custom # disable k0s's bundled (Go) kube-router; kube-router-rs is the CNI
          kubeProxy:
            disabled: true # kube-router-rs provides the service proxy (IPVS); avoid double-programming
          # k0s still allocates per-node podCIDRs from this range for our agent to consume.
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
